services:
  cardscanner:
    build: .
    container_name: cardscanner
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      - cardscanner-data:/data
    env_file:
      - path: .env
        required: false
    environment:
      - DB_PATH=/data/cardscanner.db
      - GOOGLE_TOKEN_PATH=/data/google_token.json
      - EBAY_TOKEN_PATH=/data/ebay_token.json
      - GOOGLE_OAUTH_CLIENT_SECRETS=/data/google_client_secret.json
      - CARDSCANNER_PW_HEADLESS=0
      - CARDSCANNER_PW_PROFILE=/data/playwright-profile
      - HOST=0.0.0.0
      - VISION_BACKEND=${VISION_BACKEND:-ollama}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_VISION_MODEL=${OLLAMA_VISION_MODEL:-llama3.2-vision:11b}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-}
      - SKIP_COMP_LOOKUP=${SKIP_COMP_LOOKUP:-true}
      - NTFY_TOPIC=${NTFY_TOPIC:-cardScanner}
      - NTFY_SERVER=${NTFY_SERVER:-https://ntfy.sh}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  cardscanner-data:
